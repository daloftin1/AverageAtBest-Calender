name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to EC2 via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USER }}
                key: ${{ secrets.EC2_SSH_KEY }}
                script: |
                  set -e
                  cd ~/aws-test

                  git remote set-url origin https://samantinoro:${{ secrets.GH_PAT }}@github.com/daloftin1/AverageAtBest-Calender.git
                  git fetch origin main
                  git reset --hard origin/main

                  export PATH="$HOME/miniconda3/bin:$PATH"
                  source ~/miniconda3/etc/profile.d/conda.sh
                  conda activate dj_web

                  python manage.py migrate --noinput
                  python manage.py collectstatic --noinput

                  sudo find /home/ubuntu/aws-test/static/ -type d -exec chmod 755 {} \;
                  sudo find /home/ubuntu/aws-test/static/ -type f -exec chmod 644 {} \;
                  sudo chown -R www-data:www-data /home/ubuntu/aws-test/static/

                  sudo systemctl restart gunicorn