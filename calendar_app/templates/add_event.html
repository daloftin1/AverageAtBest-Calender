{% extends "base.html" %}

{% block title %}{% if editing %}Edit event{% else %}Add event{% endif %} | Calendar{% endblock %}

{% block content %}
<main class="auth-page">
    <section class="auth-card form-card" aria-labelledby="event-title">
        <h1 id="event-title">{% if editing %}Edit event{% else %}Add event{% endif %}</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="login-button" type="submit">Save event</button>
        </form>
        <p class="auth-footer"><a href="{% url 'calendar' %}">Back to calendar</a></p>
    </section>
</main>
{% endblock %}
