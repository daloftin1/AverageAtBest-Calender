{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | Calendar</title>
    <link rel="stylesheet" href="{% static 'calendar_app/calendar.css' %}">
    <link rel="stylesheet" href="{% static 'calendar_app/auth.css' %}">
</head>
<body>
    <div class="app-shell">
        <header class="top-bar">
            <a class="brand" href="{% url 'calendar' %}">Calendar</a>
        </header>

        <main class="auth-page">
            <section class="auth-card" aria-labelledby="login-title">
                <h1 id="login-title">Log in</h1>

                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">

                    {% if form.non_field_errors %}
                    <div class="form-errors" role="alert">
                        {{ form.non_field_errors }}
                    </div>
                    {% endif %}

                    <div class="auth-field">
                        <label for="{{ form.username.id_for_label }}">Username</label>
                        {{ form.username }}
                        {{ form.username.errors }}
                    </div>

                    <div class="auth-field">
                        <label for="{{ form.password.id_for_label }}">Password</label>
                        {{ form.password }}
                        {{ form.password.errors }}
                    </div>

                    <button class="login-button" type="submit">Log in</button>
                </form>

                <p class="auth-footer">
                    No account? <a href="{% url 'register' %}">Create an account</a>
                </p>
            </section>
        </main>
    </div>
</body>
</html>
